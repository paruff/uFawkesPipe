name: Reusable SBOM Generation

# Generates an SBOM with syft, in the suite's CI image (ci-pipeline spec R4). Ported from
# fawkes's local copy, with these differences:
#   - runs in ci-image (by digest) instead of installing syft on the runner;
#   - scan-target is an input. The default, dir:., scans the source checkout, which is what
#     the fawkes copy did even though it labelled the file with an image name and tag; pass
#     an image ref to scan the image.
#   - the package count is read from the SBOM's own structure, not grepped.

on:
  workflow_call:
    inputs:
      ci-image:
        description: >-
          ghcr.io/paruff/ufawkes-ci@sha256:<64 hex>. Required; a ref without a digest fails the job.
        required: true
        type: string
      image-name:
        description: "Name used to label the SBOM (and, for an image scan, the image)"
        required: true
        type: string
      image-tag:
        description: "Tag used to label the SBOM"
        required: false
        type: string
        default: "latest"
      scan-target:
        description: "What syft scans: dir:. (the source checkout) or an image ref"
        required: false
        type: string
        default: "dir:."
      upload-artifact:
        description: "Upload the SBOM as a workflow artifact"
        required: false
        type: boolean
        default: true
      sbom-format:
        description: "SBOM format (cyclonedx-json, spdx-json, syft-json)"
        required: false
        type: string
        default: "cyclonedx-json"
    outputs:
      sbom-path:
        description: "Path of the generated SBOM file"
        value: ${{ jobs.generate-sbom.outputs.sbom-path }}

permissions: {} # deny all at workflow level; grant per job below

jobs:
  generate-sbom:
    name: Generate SBOM
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this repo's CI image, by digest, becomes the container; anything else stays on the
    # host, where the first step fails the job.
    container: ${{ startsWith(inputs.ci-image, 'ghcr.io/paruff/ufawkes-ci@sha256:') && inputs.ci-image || null }}
    defaults:
      run:
        shell: bash -e {0}
    outputs:
      sbom-path: ${{ steps.generate.outputs.sbom-path }}
    steps:
      - name: Require a digest-pinned ufawkes-ci image
        env:
          CI_IMAGE: ${{ inputs.ci-image }}
        run: |
          if ! [[ "$CI_IMAGE" =~ ^ghcr\.io/paruff/ufawkes-ci@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ci-image must be ghcr.io/paruff/ufawkes-ci@sha256:<64 hex>, got '${CI_IMAGE}'"
            exit 1
          fi

      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate SBOM
        id: generate
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          SBOM_FORMAT: ${{ inputs.sbom-format }}
          SCAN_TARGET: ${{ inputs.scan-target }}
        run: |
          # image-name may be owner-prefixed ("paruff/some-service"): a "/" would be read as a
          # path separator in the file name (seen live in fawkes#2032).
          SAFE_NAME="$(echo "$IMAGE_NAME" | tr '/' '-')"
          SBOM_FILE="sbom-${SAFE_NAME}-${IMAGE_TAG}.json"
          syft scan "$SCAN_TARGET" -o "${SBOM_FORMAT}=${SBOM_FILE}"
          echo "sbom-path=$SBOM_FILE" >> "$GITHUB_OUTPUT"
          echo "safe-name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate SBOM
        env:
          SBOM_FILE: ${{ steps.generate.outputs.sbom-path }}
          SBOM_FORMAT: ${{ inputs.sbom-format }}
        run: |
          if [ ! -s "$SBOM_FILE" ]; then
            echo "::error::SBOM file is empty or missing: $SBOM_FILE"
            exit 1
          fi
          case "$SBOM_FORMAT" in
            cyclonedx-json) count="$(jq '.components | length' "$SBOM_FILE")" ;;
            spdx-json) count="$(jq '.packages | length' "$SBOM_FILE")" ;;
            syft-json) count="$(jq '.artifacts | length' "$SBOM_FILE")" ;;
            *) echo "::error::unsupported sbom-format '$SBOM_FORMAT'"; exit 1 ;;
          esac
          if [ "$count" -eq 0 ]; then
            echo "::error::SBOM lists no packages: $SBOM_FILE"
            exit 1
          fi
          echo "packages=$count" >> "$GITHUB_ENV"

      - name: Display SBOM summary
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          SBOM_FORMAT: ${{ inputs.sbom-format }}
          SCAN_TARGET: ${{ inputs.scan-target }}
          SBOM_FILE: ${{ steps.generate.outputs.sbom-path }}
        run: |
          {
            echo "### SBOM Generation Summary"
            echo ""
            echo "- **Labelled**: ${IMAGE_NAME}:${IMAGE_TAG}"
            echo "- **Scanned**: ${SCAN_TARGET}"
            echo "- **Format**: ${SBOM_FORMAT}"
            echo "- **File**: ${SBOM_FILE}"
            echo "- **Packages**: ${packages}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ steps.generate.outputs.safe-name }}-${{ inputs.image-tag }}
          path: ${{ steps.generate.outputs.sbom-path }}
          retention-days: 90

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
