name: Reusable Build & Validate

on:
  workflow_call:
    inputs:
      validate-prometheus:
        description: "Validate Prometheus config"
        required: false
        type: boolean
        default: false
      validate-otel:
        description: "Validate OTel Collector config"
        required: false
        type: boolean
        default: false
      validate-tempo:
        description: "Validate Tempo config"
        required: false
        type: boolean
        default: false
      validate-grafana:
        description: "Validate Grafana provisioning"
        required: false
        type: boolean
        default: false
      prometheus-image:
        description: "Prometheus image for config validation"
        required: false
        type: string
        default: "prom/prometheus:v2.55.1"
      otel-image:
        description: "OTel Collector image for config validation"
        required: false
        type: string
        default: "otel/opentelemetry-collector-contrib:0.120.0"
      tempo-image:
        description: "Tempo image for config validation"
        required: false
        type: string
        default: "grafana/tempo:2.10.5"
      fail-on-latest:
        description: "Fail if :latest tags found in compose.yaml"
        required: false
        type: boolean
        default: true
      allow-latest:
        description: "Comma-separated list of image patterns (e.g., 'aquasec/trivy:latest') to allow :latest for"
        required: false
        type: string
        default: ""
      enable-coverage-gate:
        description: "Enable coverage quality gate"
        required: false
        type: boolean
        default: true
      coverage-threshold:
        description: "Minimum coverage percentage for quality gate"
        required: false
        type: number
        default: 60
      python-version:
        description: "Python version for coverage gate"
        required: false
        type: string
        default: "3.11"
      coverage-paths:
        description: "Comma-separated package paths to measure coverage"
        required: false
        type: string
        default: "compute,ingestion"

permissions: {}  # deny all at workflow level; grant per job below

jobs:
  build-validate:
    permissions:
      contents: read
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ─── Supply Chain ────────────────────────────────────────────────────
      - name: Fail if ':latest' is used
        if: inputs.fail-on-latest
        env:
          ALLOW_LATEST: ${{ inputs.allow-latest }}
        run: |
          ALLOW_LIST="${ALLOW_LATEST}"
          IFS=',' read -ra ALLOWED <<< "$ALLOW_LIST"
          ALLOW_PATTERN=""
          for a in "${ALLOWED[@]}"; do
            a=$(echo "$a" | xargs)
            if [ -n "$a" ]; then
              ALLOW_PATTERN="${ALLOW_PATTERN}|${a}"
            fi
          done
          if [ -n "$ALLOW_PATTERN" ]; then
            ALLOW_PATTERN="${ALLOW_PATTERN#|}"
          fi

          if grep -R "image: .*:latest" -n compose.yaml; then
            if [ -n "$ALLOW_PATTERN" ]; then
              if grep -R "image: .*:latest" -n compose.yaml | grep -vE "$ALLOW_PATTERN"; then
                echo "::error::Do not use :latest tags in compose.yaml (except allowed: $ALLOW_PATTERN)"; exit 1; fi
              echo "✅ No :latest tags found (excluding allowed: $ALLOW_PATTERN)"
            else
              echo "::error::Do not use :latest tags in compose.yaml"
              exit 1
            fi
          else
            echo "✅ No :latest tags found"
          fi

      # ─── Config Validation: Prometheus ──────────────────────────────────
      - name: Validate Prometheus config
        if: inputs.validate-prometheus && hashFiles('config/prometheus/prometheus.yaml') != ''
        env:
          PROMETHEUS_IMAGE: ${{ inputs.prometheus-image }}
        run: |
          echo "Validating Prometheus config..."
          docker run --rm \
            -v $PWD/config/prometheus:/etc/prometheus \
            --entrypoint promtool \
            "$PROMETHEUS_IMAGE" \
            check config /etc/prometheus/prometheus.yaml
          echo "✅ Prometheus config valid"

      # ─── Config Validation: OTel Collector ──────────────────────────────
      - name: Validate OTel config
        if: inputs.validate-otel && hashFiles('config/otel/collector.yaml') != ''
        env:
          OTEL_IMAGE: ${{ inputs.otel-image }}
        run: |
          echo "Validating OTel Collector config..."
          docker run --rm \
            -v $PWD/config/otel/collector.yaml:/etc/otel/config.yaml \
            "$OTEL_IMAGE" \
            validate --config=/etc/otel/config.yaml
          echo "✅ OTel Collector config valid"

      # ─── Config Validation: Tempo ───────────────────────────────────────
      - name: Validate Tempo config
        if: inputs.validate-tempo && hashFiles('config/tempo/tempo.yaml') != ''
        env:
          TEMPO_IMAGE: ${{ inputs.tempo-image }}
        run: |
          echo "Validating Tempo config..."
          docker run --rm \
            -v $PWD/config/tempo/tempo.yaml:/etc/tempo.yaml \
            "$TEMPO_IMAGE" \
            -config.file=/etc/tempo.yaml -config.verify=true
          echo "✅ Tempo config valid"

      # ─── Config Validation: Grafana ─────────────────────────────────────
      - name: Validate Grafana provisioning
        if: inputs.validate-grafana
        run: |
          echo "Checking Grafana provisioning files..."
          if [ -d "config/grafana/provisioning" ]; then
            find config/grafana/provisioning -name "*.yaml" -o -name "*.yml" | while read f; do
              echo "Checking: $f"
              python3 -c "import yaml; yaml.safe_load(open('$f'))" || { echo "❌ Invalid YAML: $f"; exit 1; }
            done
            echo "✅ Grafana provisioning configs valid"
          else
            echo "⚠️  No Grafana provisioning directory found"
          fi

      # ─── Coverage Quality Gate ─────────────────────────────────────────
      - name: Set up Python for coverage
        if: inputs.enable-coverage-gate
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.1.1
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install test dependencies
        if: inputs.enable-coverage-gate
        run: |
          pip install -r requirements-test.txt

      - name: Run coverage quality gate
        if: inputs.enable-coverage-gate
        id: coverage
        continue-on-error: true
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          COVERAGE_PATHS: ${{ inputs.coverage-paths }}
        run: |
          THRESHOLD="$COVERAGE_THRESHOLD"
          PATHS="${COVERAGE_PATHS}"
          COV_ARGS=""
          IFS=',' read -ra PKG <<< "$PATHS"
          for pkg in "${PKG[@]}"; do
            pkg=$(echo "$pkg" | xargs)
            COV_ARGS="$COV_ARGS --cov=$pkg"
          done

          # Run unit tests with coverage, fail if below threshold
          if [ -d "tests/unit" ]; then
            echo "Running coverage gate at ${THRESHOLD}%..."
            if pytest tests/unit/ -v --tb=short $COV_ARGS \
              --cov-report=term-missing \
              --cov-fail-under=$THRESHOLD; then
              echo "coverage_result=pass" >> $GITHUB_OUTPUT
            else
              echo "coverage_result=failure" >> $GITHUB_OUTPUT
            fi
          else
            echo "No unit tests found, skipping coverage gate"
            echo "coverage_result=skip" >> $GITHUB_OUTPUT
          fi

      - name: Check coverage result
        if: inputs.enable-coverage-gate && steps.coverage.outputs.coverage_result == 'failure'
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          echo "::error::Coverage gate FAILED — below ${COVERAGE_THRESHOLD}% threshold"
          exit 1

      # ─── Build Summary ──────────────────────────────────────────────────
      - name: Generate build summary
        if: always()
        env:
          FAIL_ON_LATEST: ${{ inputs.fail-on-latest }}
          ALLOW_LATEST: ${{ inputs.allow-latest }}
          VALIDATE_PROMETHEUS: ${{ inputs.validate-prometheus }}
          VALIDATE_OTEL: ${{ inputs.validate-otel }}
          VALIDATE_TEMPO: ${{ inputs.validate-tempo }}
          VALIDATE_GRAFANA: ${{ inputs.validate-grafana }}
          ENABLE_COVERAGE_GATE: ${{ inputs.enable-coverage-gate }}
          COVERAGE_RESULT: ${{ steps.coverage.outputs.coverage_result }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          echo "### Build & Validate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${FAIL_ON_LATEST}" == "true" ]; then
            if [ -n "${ALLOW_LATEST}" ]; then
              echo "- ✅ Supply chain: No :latest tags (allow: ${ALLOW_LATEST})" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ✅ Supply chain: No :latest tags" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          if [ "${VALIDATE_PROMETHEUS}" == "true" ]; then
            echo "- ✅ Prometheus config validated" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${VALIDATE_OTEL}" == "true" ]; then
            echo "- ✅ OTel Collector config validated" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${VALIDATE_TEMPO}" == "true" ]; then
            echo "- ✅ Tempo config validated" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${VALIDATE_GRAFANA}" == "true" ]; then
            echo "- ✅ Grafana provisioning validated" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${ENABLE_COVERAGE_GATE}" == "true" ]; then
            if [ "${COVERAGE_RESULT}" == "pass" ]; then
              echo "- ✅ Coverage gate: ${COVERAGE_THRESHOLD}% threshold met" >> $GITHUB_STEP_SUMMARY
            elif [ "${COVERAGE_RESULT}" == "skip" ]; then
              echo "- ⏭️ Coverage gate: skipped (no unit tests)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Coverage gate: BELOW ${COVERAGE_THRESHOLD}% threshold" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
