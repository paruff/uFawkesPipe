name: Main CI Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  check-main-ci:
    name: "🛡️ Main CI Health"
    uses: paruff/ufawkespipe/.github/workflows/reusable-main-ci-guard.yml@93650e69ae0fa22d9e1aaff0d4b98236ab52ab14 # v1.15.0-beta.1
    with:
      workflow-id: ci-pipeline.yml
      workflow-name: "CI Pipeline"
