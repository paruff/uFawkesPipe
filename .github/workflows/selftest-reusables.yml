name: Reusables self-test

# The suite's pipeline calls the *released* reusables, so a change to one is first
# exercised after the next release. This runs the changed workflow from the PR itself
# (the ./ path), for the paths a caller can break.

on:
  pull_request:
    paths:
      - ".github/workflows/reusable-security-scanning.yml"
      - ".github/workflows/reusable-sbom-generation.yml"
      - ".github/workflows/reusable-image-signing.yml"
      - ".github/workflows/reusable-policy-enforcement.yml"
      - "tests/fixtures/**"
      - ".github/workflows/selftest-reusables.yml"

permissions:
  contents: read

jobs:
  security-scanning-image:
    name: security-scanning scans an image
    # Scans the public CI image by digest. Not a gate on that image's findings
    # (fail-on-critical is off); it proves the image-ref path runs and reports.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-security-scanning.yml
    with:
      scan-type: vulnerabilities
      image-ref: ghcr.io/paruff/ufawkes-ci@sha256:e85db8b3554da7c3362303d0e1e9681997d78093269b641e3535989f9c66f4da
      severity-threshold: CRITICAL
      fail-on-critical: false
      ignore-unfixed: true
      upload-sarif: false

  # The next two run the reusables that execute in ufawkes-ci. The image must be one that has
  # syft and conftest in it (published from images/ci).
  sbom:
    name: sbom-generation scans a source directory
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-sbom-generation.yml
    with:
      ci-image: CI_IMAGE_PLACEHOLDER
      image-name: selftest
      scan-target: "dir:tests/fixtures/sbom"
      upload-artifact: false

  policy:
    name: policy-enforcement passes a compliant manifest
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-policy-enforcement.yml
    with:
      ci-image: CI_IMAGE_PLACEHOLDER
      policy-path: tests/fixtures/policy/policies
      target-path: tests/fixtures/policy/ok

# Not exercised here, deliberately: a failing path (a violating manifest, a missing policy
# directory) would turn this whole workflow red, so those are checked by hand; and image
# signing needs a pushed image and a real OIDC token, so its first real run is its test.
