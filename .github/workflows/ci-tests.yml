name: CI Tests

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Total test timeout in minutes"
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  # ─── Unit Tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pyyaml docker

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=tests/unit --cov-report=term-missing
        continue-on-error: false

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─── Integration Tests ─────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pyyaml docker requests

      - name: Start Docker Compose stack
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short --cov=tests/integration --cov-report=term-missing
        continue-on-error: false

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs > docker-compose-logs.txt 2>&1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: docker-compose-logs.txt
          retention-days: 7

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─── Smoke Tests ───────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Docker Compose stack
        run: |
          docker compose up -d
          echo "Waiting for Jenkins to be healthy..."
          sleep 60

      - name: Check Jenkins health
        run: |
          echo "Checking Jenkins health endpoint..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login 2>/dev/null | grep -q "Jenkins"; then
              echo "✅ Jenkins is healthy"
              exit 0
            fi
            echo "Waiting for Jenkins... ($i/30)"
            sleep 10
          done
          echo "❌ Jenkins failed to start"
          docker compose logs jenkins
          exit 1

      - name: Check Jenkins API
        run: |
          echo "Checking Jenkins API..."
          curl -sf http://localhost:8080/api/json?pretty=true | head -20

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─── Acceptance Tests ──────────────────────────────────────────────────────
  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [integration-tests, smoke-tests]
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pyyaml docker requests jenkinsapi

      - name: Start Docker Compose stack
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 60

      - name: Run acceptance tests
        run: |
          pytest tests/acceptance/ -v --tb=short --cov=tests/acceptance --cov-report=term-missing
        continue-on-error: false

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs > docker-compose-logs.txt 2>&1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-logs
          path: docker-compose-logs.txt
          retention-days: 7

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v

      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─── Test Summary ──────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, smoke-tests, acceptance-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== Test Results ==="
          echo "Unit Tests:         ${{ needs.unit-tests.result }}"
          echo "Integration Tests:  ${{ needs.integration-tests.result }}"
          echo "Smoke Tests:        ${{ needs.smoke-tests.result }}"
          echo "Acceptance Tests:   ${{ needs.acceptance-tests.result }}"

          if [ "${{ needs.unit-tests.result }}" == "failure" ] || \
             [ "${{ needs.integration-tests.result }}" == "failure" ] || \
             [ "${{ needs.smoke-tests.result }}" == "failure" ] || \
             [ "${{ needs.acceptance-tests.result }}" == "failure" ]; then
            echo ""
            echo "❌ Tests FAILED"
            exit 1
          fi

          echo ""
          echo "✅ All tests PASSED"

      - name: Generate summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit | ${{ needs.unit-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke | ${{ needs.smoke-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Acceptance | ${{ needs.acceptance-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
