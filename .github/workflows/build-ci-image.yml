# Build, verify and publish ghcr.io/paruff/ufawkes-ci (docs/ci-runner-image/).
# Mirrors uFawkesAI's build-devsecops-images.yml.
#
#   PR (image paths): build natively on amd64 + arm64, run tests/verify.sh on it,
#     Trivy report-only. Never publishes.
#   Push to main (image paths) / tag v<SemVer>: the same, with the Trivy gate,
#     then publish multi-arch (zstd, SBOM + provenance), self-tag sha256-<digest>,
#     sign keyless (GitHub OIDC), and verify the pushed digest.
#   Weekly / manual: the same with the Trivy gate, rescans for new CVEs.
#
# Verify a published image (cosign v3+: signatures are OCI referrers):
#   cosign verify ghcr.io/paruff/ufawkes-ci@<digest> \
#     --certificate-identity-regexp '^https://github.com/paruff/uFawkesPipe/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Build ufawkes-ci image

on:
  pull_request:
    paths:
      - "images/ci/**"
      - ".github/workflows/build-ci-image.yml"
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every v* tag publishes.
    tags: ["v*"]
    paths:
      - "images/ci/**"
      - ".github/workflows/build-ci-image.yml"
  schedule:
    - cron: "41 6 * * 1" # Mondays: rescan the image for new CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ci-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/paruff/ufawkes-ci

jobs:
  build:
    name: "🐳 build + verify (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # SARIF upload (not on pull requests)
    env:
      # A newly published CVE must not block unrelated PRs: the gate applies to
      # everything but pull requests.
      GATE_EXIT: ${{ github.event_name == 'pull_request' && '0' || '1' }}
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --load -t ufawkes-ci:ci images/ci \
            --cache-from "type=gha,scope=ufawkes-ci-${ARCH}" \
            --cache-to "type=gha,mode=max,scope=ufawkes-ci-${ARCH}"

      - name: release-match self-test
        run: bash images/ci/tests/test-release-match.sh

      - name: Verify (tests/verify.sh, offline where the spec says offline)
        run: bash images/ci/tests/verify.sh ufawkes-ci:ci

      - name: Trivy, SARIF
        run: |
          mkdir -p scan-out
          docker run --rm --user root \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan-out:/out" \
            ufawkes-ci:ci trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /out/trivy.sarif ufawkes-ci:ci
      - name: Upload Trivy results to GitHub Security
        if: always() && github.event_name != 'pull_request' && matrix.arch == 'amd64' && hashFiles('scan-out/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scan-out/trivy.sarif
          category: ufawkes-ci
      # Like uFawkesAI's: gate what this repo controls (docker CLI, compose, the
      # runner, semgrep's dependencies), report the rest. fawkes-core's own tools
      # and the Debian base are fixed by core's rebuild. See tests/trivy-gate.sh.
      - name: Trivy gate self-test
        run: bash images/ci/tests/test-trivy-gate.sh
      - name: Trivy, gate fixable HIGH/CRITICAL in what this image adds
        run: |
          docker run --rm --user root \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan-out:/out" \
            ufawkes-ci:ci trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output /out/trivy.json ufawkes-ci:ci
          args=()
          [[ "${GATE_EXIT}" == 0 ]] && args=(--report-only)
          bash images/ci/tests/trivy-gate.sh scan-out/trivy.json images/ci/trivy-exceptions.json \
            images/ci/python/requirements.lock "${args[@]}"

      - name: Manifest and size
        if: always()
        run: |
          {
            echo '### tools.json (${{ matrix.arch }})'
            docker run --rm ufawkes-ci:ci jq -c '.[] | {name, version}' /etc/ufawkes/tools.json
            docker image ls ufawkes-ci:ci --format 'size: {{.Size}}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  publish:
    name: "📦 publish + sign"
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A malformed tag must fail here, not publish an image nobody can pin.
      - name: Validate the release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$REF_NAME" =~ $re ]]; then
            echo "::error::'${REF_NAME}' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - name: Tags
        id: meta
        # Index-level annotations carry org.opencontainers.image.source, which
        # links a multi-arch GHCR package to this repo (labels alone don't).
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: latest=false

      - name: Build + push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/ci
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          cache-from: |
            type=gha,scope=ufawkes-ci-amd64
            type=gha,scope=ufawkes-ci-arm64
          provenance: mode=max
          sbom: true

      # The digest is only known after the push, so the self-tag is added here.
      - name: Self-tag sha256-<digest>
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:sha256-${DIGEST#sha256:}" "${IMAGE}@${DIGEST}"
      - name: Sign the digest (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "- signed \`${IMAGE}@${DIGEST}\`" >>"$GITHUB_STEP_SUMMARY"
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  verify-published:
    name: "✅ verify the pushed digest"
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Signature is valid and was made by this repo's workflow
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github.com/paruff/uFawkesPipe/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Acceptance checks against the pushed digest
        run: bash images/ci/tests/verify.sh "${IMAGE}@${DIGEST}"
      - name: Manifest of the published image
        run: |
          {
            echo '### /etc/ufawkes/tools.json'
            echo "digest: \`${DIGEST}\`"
            docker run --rm "${IMAGE}@${DIGEST}" jq -c '.[] | {name, version}' /etc/ufawkes/tools.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
