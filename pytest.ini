[pytest]
testpaths = tests/unit tests/integration tests/smoke tests/acceptance
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated, no external deps)
    integration: Integration tests (cross-component, may require Docker)
    smoke: Smoke tests (require running stack)
    acceptance: Acceptance tests (full E2E pipeline validation)
