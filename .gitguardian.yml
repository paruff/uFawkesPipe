# GitGuardian secret scan configuration
# https://docs.gitguardian.com/secrets-detection/gitguardian-ci

# Ignore test files with test-only credentials
paths-ignore:
  - "tests/acceptance/**/*.py"
  - "tests/acceptance/conftest.py"

# Ignore specific patterns for test credentials
# Portainer test password, SonarQube default admin/admin
# These are well-known dev defaults, not real secrets

# Also use inline ignore comments: # ggshield-ignore
