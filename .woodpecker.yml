# uFawkesPipe CI Pipeline — v2.0
# Runs on every push and pull request
#
# Pipeline stages (ordered by depends_on):
#   1. validate   — init, lint-yaml, lint-shell (parallel)
#   2. test       — unit-tests, integration-tests, contract-tests (parallel)
#   3. security   — secrets-scan → vuln-scan-fs → vuln-scan-image (sequential)
#   4. build      — build-image (main only)
#   5. publish    — upload-defectdojo (main only)
#   6. deploy     — notify-obs (main only)
#
# DORA logging: All steps use scripts/dora-log.sh for structured JSON
# output compatible with uFawkesObs/Loki ingestion via Alloy.
#
# Telemetry:
#   Metrics — Woodpecker server exposes /metrics (prometheus scrape)
#   Logs — Alloy scrapes Docker container logs (structured JSON)
#   Traces — future (Woodpecker OTEL native support not yet available)
#   Events — notify-step emits deployment events (structured JSON)

when:
  - event: [push, pull_request]

# ============================================================================
# Reusable step anchors (defined here for YAML-compatible merging)
# Reference patterns in .woodpecker/steps/common.yaml as source of truth.
# ============================================================================

x-dora-log: &dora-log
  commands:
    - source /drone/src/scripts/dora-log.sh
    - dora_start "${CI_STEP_NAME}"

x-dora-end: &dora-end
  commands:
    - source /drone/src/scripts/dora-log.sh
    - dora_end "${CI_STEP_NAME}"

# ============================================================================
# Stage 1: validate — Lint, syntax checks (fast, parallel)
# ============================================================================

steps:
  # Initialize artifact directories
  - name: init
    image: alpine:3.20
    commands:
      - source /drone/src/scripts/dora-log.sh
      - dora_start "init"
      - mkdir -p artifacts/security artifacts/coverage artifacts/tests
      - dora_info "init" "Artifact directories created"
      - dora_end "init"

  # YAML linting — validate compose.yaml, .woodpecker.yml, .env.example
  - name: lint-yaml
    image: python:3.12-slim
    depends_on: [init]
    commands:
      - pip install yamllint pyyaml --quiet
      - source /drone/src/scripts/dora-log.sh
      - dora_start "lint-yaml"
      - yamllint compose.yaml .woodpecker.yml .env.example && rc=$? || rc=$?
      - dora_emit "$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'warn'; fi)" "validate" "yamllint completed" ",\"exit_code\":$rc"
      - exit $rc

  # Shell script linting
  - name: lint-shell
    image: koalaman/shellcheck-alpine:stable
    depends_on: [init]
    commands:
      - source /drone/src/scripts/dora-log.sh
      - dora_start "lint-shell"
      - shellcheck scripts/*.sh validate.sh && rc=$? || rc=$?
      - dora_emit "$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'warn'; fi)" "validate" "shellcheck completed" ",\"exit_code\":$rc"
      - exit $rc

# ============================================================================
# Stage 2: test — Unit, integration, and contract tests (parallel)
# ============================================================================

  # Unit tests — fast, isolated, no external deps
  - name: unit-tests
    image: python:3.12-slim
    depends_on: [lint-yaml, lint-shell]
    commands:
      - pip install -r tests/requirements.txt --quiet
      - source /drone/src/scripts/dora-log.sh
      - dora_start "unit-tests"
      - pytest tests/unit/ -v --tb=short -m "not integration and not smoke and not acceptance" --junitxml=artifacts/tests/junit.xml 2>&1 | tee /dev/stderr; rc=${PIPESTATUS[0]}
      - dora_emit "$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)" "test" "Unit tests completed" ",\"exit_code\":$rc"
      - exit $rc

  # Integration tests — cross-component, may require Docker
  - name: integration-tests
    image: python:3.12-slim
    depends_on: [lint-yaml, lint-shell]
    commands:
      - pip install -r tests/requirements.txt --quiet
      - source /drone/src/scripts/dora-log.sh
      - dora_start "integration-tests"
      - pytest tests/integration/ -v --tb=short -m integration --junitxml=artifacts/tests/junit-integration.xml 2>&1 | tee /dev/stderr; rc=${PIPESTATUS[0]}
      - dora_emit "$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)" "test" "Integration tests completed" ",\"exit_code\":$rc"
      - exit $rc

  # Contract tests — pipeline contract validation
  - name: contract-tests
    image: python:3.12-slim
    depends_on: [lint-yaml, lint-shell]
    commands:
      - pip install -r tests/requirements.txt --quiet
      - source /drone/src/scripts/dora-log.sh
      - dora_start "contract-tests"
      - pytest tests/ tests/integration/ -v --tb=short -k "contract or compose or yaml" --junitxml=artifacts/tests/junit-contract.xml 2>&1 | tee /dev/stderr; rc=${PIPESTATUS[0]}
      - dora_emit "$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)" "test" "Contract tests completed" ",\"exit_code\":$rc"
      - exit $rc

# ============================================================================
# Stage 3: security — Secret scan, vulnerability scan, SAST (sequential gates)
# ============================================================================

  # Hard gate: Gitleaks secret detection
  - name: secrets-scan
    image: zricethezav/gitleaks:v8.18.2
    depends_on: [unit-tests, integration-tests, contract-tests]
    commands:
      - source /drone/src/scripts/dora-log.sh
      - dora_start "secrets-scan"
      - gitleaks detect --source=. --report-format=json --report-path=artifacts/security/gitleaks.json --exit-code=1 && rc=$? || rc=$?
      - dora_emit "$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)" "security" "Gitleaks scan completed" ",\"exit_code\":$rc,\"secrets_found\":$(if [ $rc -eq 0 ]; then echo 'false'; else echo 'true'; fi)"
      - exit $rc

  # Trivy filesystem vulnerability scan (entire working tree)
  - name: vuln-scan-fs
    image: aquasec/trivy:latest
    depends_on: [secrets-scan]
    commands:
      - source /drone/src/scripts/dora-log.sh
      - dora_start "vuln-scan-fs"
      - trivy fs --format json --output artifacts/security/trivy-repo.json --no-progress . && rc=$? || rc=$?
      - dora_emit "$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)" "security" "Trivy filesystem scan completed" ",\"exit_code\":$rc"
      - exit $rc

  # Trivy container image vulnerability scan (main branch only)
  - name: vuln-scan-image
    image: aquasec/trivy:latest
    depends_on: [secrets-scan]
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
    commands:
      - source /drone/src/scripts/dora-log.sh
      - dora_start "vuln-scan-image"
      - trivy image --format json --output artifacts/security/trivy-image.json --no-progress ${REGISTRY_USERNAME}/${CI_REPO_NAME}:${CI_COMMIT_SHA:0:7} && rc=$? || rc=$?
      - dora_emit "$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)" "security" "Trivy image scan completed" ",\"exit_code\":$rc"
      - exit $rc
    when:
      - event: push
        branch: main

# ============================================================================
# Stage 4: build — Container image build
# ============================================================================

  # Container image build via CNB
  - name: build-image
    image: alpine:3.20
    depends_on: [vuln-scan-fs, vuln-scan-image]
    commands:
      - source /drone/src/scripts/dora-log.sh
      - dora_start "build-image"
      - echo "📦 Container build placeholder — CNB build would execute here"
      - dora_info "build" "Build step completed (placeholder)"
      - dora_end "build-image"
    when:
      - event: push
        branch: main

# ============================================================================
# Stage 5: publish — Push to registry, upload security artifacts
# ============================================================================

  # Upload Gitleaks + Trivy results to DefectDojo (non-blocking, main only)
  - name: upload-defectdojo
    image: curlimages/curl:8.6.0
    depends_on: [build-image]
    environment:
      DOJO_API_TOKEN:
        from_secret: defectdojo_api_token
    commands:
      - source /drone/src/scripts/dora-log.sh
      - dora_start "upload-defectdojo"
      - |
        for f in gitleaks trivy-repo trivy-image; do
          path="artifacts/security/${f}.json"
          if [ ! -f "$path" ]; then
            dora_warn "security" "Artifact not found, skipping" ",\"file\":\"${path}\""
            continue
          fi
          case "$f" in
            gitleaks)   scan_type="Gitleaks Scan" ;;
            trivy-repo|trivy-image) scan_type="Trivy Scan" ;;
          esac
          HTTP_CODE=$(curl -sf -X POST "http://defectdojo:8080/api/v2/import-scan/" \
            -H "Authorization: Token $DOJO_API_TOKEN" \
            -F "active=true" -F "verified=false" \
            -F "scan_type=${scan_type}" \
            -F "engagement_name=CI-Engagement" \
            -F "product_name=${CI_REPO_NAME}" \
            -F "file=@${path}" \
            -w '%{http_code}' -o /dev/null 2>&1) && rc=$? || rc=$?
          if [ $rc -eq 0 ] && [ "$HTTP_CODE" = "201" ]; then
            dora_info "security" "DefectDojo upload successful" ",\"file\":\"${f}\",\"http_code\":\"${HTTP_CODE}\""
          else
            dora_warn "security" "DefectDojo upload failed" ",\"file\":\"${f}\",\"http_code\":\"${HTTP_CODE:-000}\""
          fi
        done
      - dora_end "upload-defectdojo"
    when:
      - event: push
        branch: main

# ============================================================================
# Stage 6: deploy — OTEL deployment events
# ============================================================================

  # Emit structured deployment event to uFawkesObs OTEL collector (non-blocking)
  - name: notify-obs
    image: curlimages/curl:8.6.0
    depends_on: [upload-defectdojo]
    environment:
      OTEL_ENDPOINT:
        from_secret: otel_endpoint
      OTEL_HEADERS:
        from_secret: otel_headers
    commands:
      - source /drone/src/scripts/dora-log.sh
      - dora_start "notify-obs"
      - |
        if [ -n "${OTEL_ENDPOINT:-}" ]; then
          curl -sf -X POST "${OTEL_ENDPOINT}/v1/traces" \
            -H "Content-Type: application/json" \
            ${OTEL_HEADERS:+-H "${OTEL_HEADERS}"} \
            -d '{
              "resourceSpans": [{
                "resource": {
                  "attributes": [
                    {"key": "service.name", "value": {"stringValue": "ufawkespipe"}},
                    {"key": "deployment.environment", "value": {"stringValue": "production"}},
                    {"key": "deployment.version", "value": {"stringValue": "'"${CI_COMMIT_SHA:0:7}"'"}},
                    {"key": "deployment.status", "value": {"stringValue": "success"}}
                  ]
                },
                "scopeSpans": [{
                  "spans": [{
                    "name": "deployment",
                    "kind": "SPAN_KIND_INTERNAL",
                    "startTimeUnixNano": "'"$(date -u +%s)000000000"'",
                    "endTimeUnixNano": "'"$(date -u +%s)000000000"'",
                    "attributes": [
                      {"key": "git.commit.sha", "value": {"stringValue": "'"${CI_COMMIT_SHA}"'"}},
                      {"key": "git.branch", "value": {"stringValue": "'"${CI_COMMIT_BRANCH}"'"}},
                      {"key": "pipeline.duration_ms", "value": {"intValue": "'"${PIPELINE_DURATION_MS:-0}"'"}}
                    ]
                  }]
                }]
              }]
            }' \
            -w "\nHTTP %{http_code}\n" \
            -o /dev/null || true
        else
          dora_warn "observability" "OTEL_ENDPOINT not set — skipping OTEL collector POST"
        fi
      - dora_end "notify-obs"
    when:
      - event: push
        branch: main
