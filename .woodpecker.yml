# uFawkesPipe CI Pipeline
# Runs on every push and pull request
#
# Structured JSON logging: All steps emit JSON log entries that uFawkesObs
# Alloy scrapes from Docker container logs. In standalone mode, these are
# visible via `docker logs`. In suite mode, Alloy ships them to Loki.
#
# Telemetry:
#   Metrics — Woodpecker server exposes /metrics (prometheus scrape)
#   Logs — Alloy scrapes Docker container logs (structured JSON)
#   Traces — future (Woodpecker OTEL native support not yet available)
#   Events — notify-step emits deployment events (structured JSON)

when:
  - event: [push, pull_request]

steps:
  - name: init
    image: alpine:3.20
    commands:
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"init","message":"Creating artifact directories","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"init"}'
      - mkdir -p artifacts/security artifacts/coverage artifacts/tests
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"init","message":"Artifact directories created","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"init"}'

  # Gitleaks secret scan — hard gate. Uses .gitleaks.toml for custom rules
  # and .secrets.baseline for known false positives.
  - name: secrets-scan
    image: zricethezav/gitleaks:v8.18.2
    commands:
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"security","message":"Starting Gitleaks secret scan","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"secrets-scan"}'
      - gitleaks detect --source=. --report-format=json --report-path=artifacts/security/gitleaks.json --exit-code=1 && rc=$? || rc=$?
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"'"$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)"'","logger":"security","message":"Gitleaks scan completed","exit_code":'$rc',"secrets_found":$(if [ $rc -eq 0 ]; then echo 'false'; else echo 'true'; fi),"pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"secrets-scan"}'
      - exit $rc

  - name: lint-yaml
    image: python:3.12-slim
    commands:
      - pip install yamllint pyyaml --quiet
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"validate","message":"Running yamllint on compose.yaml, .woodpecker.yml, .env.example","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"lint-yaml"}'
      - yamllint compose.yaml .woodpecker.yml .env.example && rc=$? || rc=$?
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"'"$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'warn'; fi)"'","logger":"validate","message":"yamllint completed","exit_code":'$rc',"pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"lint-yaml"}'
      - exit $rc

  - name: lint-shell
    image: koalaman/shellcheck-alpine:stable
    commands:
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"validate","message":"Running shellcheck on scripts/*.sh validate.sh","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"lint-shell"}'
      - shellcheck scripts/*.sh validate.sh && rc=$? || rc=$?
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"'"$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'warn'; fi)"'","logger":"validate","message":"shellcheck completed","exit_code":'$rc',"pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"lint-shell"}'
      - exit $rc

  - name: validate-pipeline-contract
    image: python:3.12-slim
    commands:
      - pip install -r tests/requirements.txt --quiet
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"test","message":"Running pipeline contract tests","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"validate-pipeline-contract"}'
      - pytest tests/ -v --tb=short --junitxml=artifacts/tests/junit.xml 2>&1 | tee /dev/stderr; rc=${PIPESTATUS[0]}
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"'"$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)"'","logger":"test","message":"Pipeline contract tests completed","exit_code":'$rc',"pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"validate-pipeline-contract"}'
      - exit $rc

  # aquasec/trivy:latest is intentionally unpinned — scanner images need
  # current CVE databases. This is a documented exception to pinned-image policy.
  - name: vuln-scan-fs
    image: aquasec/trivy:latest
    commands:
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"security","message":"Running Trivy filesystem vulnerability scan","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"vuln-scan-fs"}'
      - trivy fs --format json --output artifacts/security/trivy-repo.json --no-progress . && rc=$? || rc=$?
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"'"$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)"'","logger":"security","message":"Trivy filesystem scan completed","exit_code":'$rc',"pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"vuln-scan-fs"}'
      - exit $rc

  # aquasec/trivy:latest is intentionally unpinned — scanner images need
  # current CVE databases. This is a documented exception to pinned-image policy.
  - name: vuln-scan-image
    image: aquasec/trivy:latest
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
    commands:
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"security","message":"Running Trivy image vulnerability scan","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"vuln-scan-image"}'
      - trivy image --format json --output artifacts/security/trivy-image.json --no-progress ${REGISTRY_USERNAME}/${CI_REPO_NAME}:${CI_COMMIT_SHA:0:7} && rc=$? || rc=$?
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"'"$(if [ $rc -eq 0 ]; then echo 'info'; else echo 'error'; fi)"'","logger":"security","message":"Trivy image scan completed","exit_code":'$rc',"pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"vuln-scan-image"}'
      - exit $rc
    when:
      - event: push
        branch: main

  # Collect scanner artifacts (gitleaks, trivy-fs, trivy-image) and POST to
  # DefectDojo import-scan API. Non-blocking — failures warn but don't fail.
  - name: upload-defectdojo
    image: curlimages/curl:8.6.0
    environment:
      DOJO_API_TOKEN:
        from_secret: defectdojo_api_token
    commands:
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"security","message":"Starting DefectDojo upload","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"upload-defectdojo"}'
      - |
        for f in gitleaks trivy-repo trivy-image; do
          path="artifacts/security/${f}.json"
          if [ ! -f "$path" ]; then
            echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"warn","logger":"security","message":"Artifact not found, skipping","file":"'"${path}"'","step":"upload-defectdojo"}'
            continue
          fi
          case "$f" in
            gitleaks)   scan_type="Gitleaks Scan" ;;
            trivy-repo|trivy-image) scan_type="Trivy Scan" ;;
          esac
          HTTP_CODE=$(curl -sf -X POST "http://defectdojo:8080/api/v2/import-scan/" \
            -H "Authorization: Token $DOJO_API_TOKEN" \
            -F "active=true" -F "verified=false" \
            -F "scan_type=${scan_type}" \
            -F "engagement_name=CI-Engagement" \
            -F "product_name=${CI_REPO_NAME}" \
            -F "file=@${path}" \
            -w '%{http_code}' -o /dev/null 2>&1) && rc=$? || rc=$?
          if [ $rc -eq 0 ] && [ "$HTTP_CODE" = "201" ]; then
            echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"security","message":"DefectDojo upload successful","file":"'"${f}"'","http_code":"'"${HTTP_CODE}"'","step":"upload-defectdojo"}'
          else
            echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"warn","logger":"security","message":"DefectDojo upload failed","file":"'"${f}"'","http_code":"'"${HTTP_CODE:-000}"'","step":"upload-defectdojo"}'
          fi
        done
    when:
      - event: push
        branch: main

  # Emit structured deployment event to uFawkesObs OTEL collector.
  # Non-blocking — observability failure must not fail the deployment.
  # Uses OTEL_ENDPOINT and OTEL_HEADERS from secrets (suite mode: otel-collector:4318).
  # OTLP HTTP traces endpoint: ${OTEL_ENDPOINT}/v1/traces
  - name: notify-obs
    image: curlimages/curl:latest
    when:
      - event: push
        branch: main
    environment:
      OTEL_ENDPOINT:
        from_secret: otel_endpoint
      OTEL_HEADERS:
        from_secret: otel_headers
    commands:
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"observability","message":"Starting notify-obs deployment event emission","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"notify-obs"}'
      - |
        # POST deployment event to OTEL collector (non-blocking)
        if [ -n "${OTEL_ENDPOINT:-}" ]; then
          curl -sf -X POST "${OTEL_ENDPOINT}/v1/traces" \
            -H "Content-Type: application/json" \
            ${OTEL_HEADERS:+-H "${OTEL_HEADERS}"} \
            -d '{
              "resourceSpans": [{
                "resource": {
                  "attributes": [
                    {"key": "service.name", "value": {"stringValue": "ufawkespipe"}},
                    {"key": "deployment.environment", "value": {"stringValue": "production"}},
                    {"key": "deployment.version", "value": {"stringValue": "'"${CI_COMMIT_SHA:0:7}"'"}},
                    {"key": "deployment.status", "value": {"stringValue": "success"}}
                  ]
                },
                "scopeSpans": [{
                  "spans": [{
                    "name": "deployment",
                    "kind": "SPAN_KIND_INTERNAL",
                    "startTimeUnixNano": "'"$(date -u +%s)000000000"'",
                    "endTimeUnixNano": "'"$(date -u +%s)000000000"'",
                    "attributes": [
                      {"key": "git.commit.sha", "value": {"stringValue": "'"${CI_COMMIT_SHA}"'"}},
                      {"key": "git.branch", "value": {"stringValue": "'"${CI_COMMIT_BRANCH}"'"}},
                      {"key": "pipeline.duration_ms", "value": {"intValue": "'"${PIPELINE_DURATION_MS:-0}"'"}}
                    ]
                  }]
                }]
              }]
            }' \
            -w "\nHTTP %{http_code}\n" \
            -o /dev/null || true
        else
          echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"warn","logger":"observability","message":"OTEL_ENDPOINT not set — skipping OTEL collector POST","step":"notify-obs"}'
        fi
      - echo '{"@timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","logger":"observability","message":"notify-obs deployment event emission completed","pipeline":"'"${CI_PIPELINE_NUMBER:-unknown}"'","repo":"'"${CI_REPO:-unknown}"'","step":"notify-obs"}'
