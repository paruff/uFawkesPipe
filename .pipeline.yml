# Pipeline contract for uFawkesPipe
# Integration & Delivery Plane — Jenkins CI/CD orchestration

pipeline:
  version: 2
  name: uFawkesPipe
  type: stack

gates:
  preflight:
    required: true
    checks:
      - pre-commit
      - commit-format
      - pr-size

  lint:
    required: true
    tools:
      - yamllint
      - markdownlint
      - prettier
      - hadolint

  security:
    required: true
    tools:
      - gitleaks
      - trivy
      - detect-secrets

  build:
    required: true
    steps:
      - docker-compose-validate
      - jcasc-validate
      - k8s-validate

  tests:
    required: true
    tiers:
      unit:
        required: true
        command: pytest tests/unit/ -v --tb=short
        coverage:
          total: 60
          diff: 80
      integration:
        required: true
        command: pytest tests/integration/ -v --tb=short
        coverage:
          total: 50
          diff: 70
      smoke:
        required: true
        command: pytest tests/smoke/ -v --tb=short
      acceptance:
        required: true
        command: pytest tests/acceptance/ -v --tb=short
        coverage:
          total: 50
          diff: 70

  deploy:
    required: false
    steps:
      - docker-compose-up
      - health-check

supply-chain:
  sbom:
    enabled: true
    format: spdx-json
    tool: syft
  image-signing:
    enabled: true
    tool: cosign
    mode: keyless
  attestation:
    enabled: true
    type: slsa
  container-scan:
    enabled: true
    tool: trivy
    severity: MEDIUM
    fail-on: critical,high

stages:
  - name: preflight
    parallel: false
  - name: lint
    parallel: true
  - name: security
    parallel: true
  - name: build
    parallel: false
  - name: tests
    parallel: true
  - name: deploy
    parallel: false

environments:
  dev:
    auto-deploy: true
    branch: main
  staging:
    auto-deploy: false
    branch: release/*
  production:
    auto-deploy: false
    branch: v*
