# Generated by scripts/generate_woodpecker_yml.py from .fawkespipe.yml
# Do not edit by hand — edit .fawkespipe.yml and run `make generate-pipeline`.
# CI should run `generate_woodpecker_yml.py --check` to gate on drift.
# advanced.timeout: 20 minutes — Woodpecker CE has no native per-pipeline YAML timeout field; configure via repo settings (see docs/KNOWN_LIMITATIONS.md L-005).

steps:
- name: lint
  image: python:3.12-slim
  commands:
  - pylint src/ && black --check src/
- name: test
  image: python:3.12-slim
  commands:
  - pytest tests/ --cov=src --cov-report=xml
  depends_on:
  - lint
- name: sast
  image: sonarsource/sonar-scanner-cli:latest
  environment:
    SONAR_HOST_URL:
      from_secret: sonarqube_url
    SONAR_TOKEN:
      from_secret: sonarqube_token
    SONARQUBE_URL:
      from_secret: sonarqube_url
    SONARQUBE_TOKEN:
      from_secret: sonarqube_token
    SONARQUBE_PROJECT_KEY: example-internal-tool
  commands:
  - T="$CI_WORKSPACE/scripts/otel-trace.sh"; if [ -f "$T" ]; then . "$T"; else otel_span_start()
    { :; }; otel_span_end() { :; }; fi; otel_span_start "sast" && trap 'otel_span_end
    "sast" "$([ "$?" = 0 ] && echo ok || echo error)"' EXIT
  - sonar-scanner -Dsonar.projectKey="$SONARQUBE_PROJECT_KEY"
  - 'STATUS="PENDING"; TRIES=0; while [ "$STATUS" = "PENDING" ] && [ "$TRIES" -lt
    60 ]; do   sleep 5; TRIES=$((TRIES+1));   STATUS=$(curl -s -u "$SONARQUBE_TOKEN:"     "$SONARQUBE_URL/api/qualitygates/project_status?projectKey=$SONARQUBE_PROJECT_KEY"     |
    python3 -c "import sys,json; print(json.load(sys.stdin).get(''projectStatus'',{}).get(''status'',''PENDING''))"     2>/dev/null
    || echo PENDING);   echo "Quality gate status: $STATUS"; done; if [ "$STATUS"
    != "OK" ]; then   echo "Quality gate failed or timed out with status: $STATUS";   exit
    1; fi'
  - trivy fs --severity HIGH,CRITICAL --exit-code 1 .
  - mkdir -p artifacts/security
  - bandit -r src/ -ll -ii -f json -o artifacts/security/bandit.json || true
  - bandit -r src/ --severity-level medium --confidence-level medium
- name: dependency-scan
  image: aquasec/trivy:latest
  commands:
  - mkdir -p artifacts/security
  - trivy fs --exit-code 1 --format json --output artifacts/security/trivy-repo.json
    .
- name: build
  image: buildpacksio/pack:0.40.11-base
  environment:
    REGISTRY_USERNAME:
      from_secret: registry_username
    REGISTRY_PASSWORD:
      from_secret: registry_password
  commands:
  - mkdir -p "$HOME/.docker"
  - AUTH=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr
    -d '\n')
  - printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
  - pack build $REGISTRY_USERNAME/${CI_REPO_NAME}:${CI_COMMIT_SHA:0:7} --builder paketobuildpacks/builder:base
    --path . --publish
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  when:
    event:
    - push
    - manual
    branch: main
- name: image-scan
  image: aquasec/trivy:latest
  commands:
  - mkdir -p artifacts/security
  - trivy image --exit-code 1 --format json --output artifacts/security/trivy-image.json
    $REGISTRY_USERNAME/${CI_REPO_NAME}:${CI_COMMIT_SHA:0:7}
  environment:
    REGISTRY_USERNAME:
      from_secret: registry_username
    REGISTRY_PASSWORD:
      from_secret: registry_password
