# Generated by scripts/generate_woodpecker_yml.py from .fawkespipe.yml
# Do not edit by hand — edit .fawkespipe.yml and run `make generate-pipeline`.
# CI should run `generate_woodpecker_yml.py --check` to gate on drift.
# advanced.timeout: 20 minutes — Woodpecker CE has no native per-pipeline YAML timeout field; configure via repo settings (see docs/KNOWN_LIMITATIONS.md L-005).

steps:
- name: lint
  image: python:3.12-slim
  commands:
  - pylint src/ && black --check src/
- name: test
  image: python:3.12-slim
  commands:
  - pytest tests/ --cov=src --cov-report=xml
  depends_on:
  - lint
- name: sast
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - sonar-scanner
- name: dependency-scan
  image: aquasec/trivy:latest
  commands:
  - trivy fs --exit-code 1 .
- name: build
  image: docker:24-cli
  commands:
  - pack build $CI_REPO_NAME --builder paketobuildpacks/builder:base
- name: image-scan
  image: aquasec/trivy:latest
  commands:
  - trivy image --exit-code 1 $CI_REPO_NAME
