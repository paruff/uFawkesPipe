# Generated by scripts/generate_woodpecker_yml.py from .fawkespipe.yml
# Do not edit by hand — edit .fawkespipe.yml and run `make generate-pipeline`.
# CI should run `generate_woodpecker_yml.py --check` to gate on drift.
# advanced.timeout: 30 minutes — Woodpecker CE has no native per-pipeline YAML timeout field; configure via repo settings (see docs/KNOWN_LIMITATIONS.md L-005).

steps:
- name: lint
  image: python:3.12-slim
  commands:
  - ruff check src/ && mypy src/
- name: test
  image: python:3.12-slim
  commands:
  - pytest tests/ --cov=src --cov-report=xml
  depends_on:
  - lint
- name: sast
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - source /drone/src/scripts/otel-trace.sh && otel_span_start "sast" && trap 'otel_span_end
    "sast" "$([ "$?" = 0 ] && echo ok || echo error)"' EXIT
  - sonar-scanner
  - 'STATUS="PENDING"; while [ "$STATUS" = "PENDING" ]; do   sleep 5;   STATUS=$(curl
    -s -u "$SONARQUBE_TOKEN:"     "$SONARQUBE_URL/api/qualitygates/project?projectKey=$SONARQUBE_PROJECT_KEY"     |
    python3 -c "import sys,json; print(json.load(sys.stdin).get(''status'',''PENDING''))");   echo
    "Quality gate status: $STATUS"; done; if [ "$STATUS" != "OK" ]; then   echo "Quality
    gate failed with status: $STATUS";   exit 1; fi'
  - trivy fs --severity HIGH,CRITICAL --exit-code 1 .
  - mkdir -p artifacts/security
  - bandit -r src/ -ll -ii -f json -o artifacts/security/bandit.json || true
  - bandit -r src/ --severity-level medium --confidence-level medium
- name: dependency-scan
  image: aquasec/trivy:latest
  commands:
  - mkdir -p artifacts/security
  - trivy fs --exit-code 1 --format json --output artifacts/security/trivy-repo.json
    .
- name: build
  image: docker:24-cli
  commands:
  - pack build $CI_REPO_NAME --builder paketobuildpacks/builder:base
- name: image-scan
  image: aquasec/trivy:latest
  commands:
  - mkdir -p artifacts/security
  - trivy image --exit-code 1 --format json --output artifacts/security/trivy-image.json
    $CI_REPO_NAME
- name: push
  image: docker:24-cli
  commands:
  - docker push $CI_REPO_NAME
