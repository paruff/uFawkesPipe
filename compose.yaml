# uFawkesPipe — CI/CD Plane of the Fawkes IDP
# Stack nickname: ufawkespipe (used in service labels)
# User-facing product name: uFawkesPipe
# License: Apache 2.0

name: ufawkespipe

services:
  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.15.0
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_BACKEND=docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - woodpecker-server
    labels:
      - "plane=ufawkespipe"
      - "component=ci-agent"
      - "managed-by=fawkes"
    restart: unless-stopped

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.15.0
    ports:
      - "8000:8000"  # UI
      - "9000:9000"  # gRPC agent communication
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=${WOODPECKER_HOST:-http://localhost:8000}
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_DATABASE_DRIVER=sqlite3
      - WOODPECKER_DATABASE_DATASOURCE=/var/lib/woodpecker/woodpecker.sqlite
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    labels:
      - "plane=ufawkespipe"
      - "component=ci-server"
      - "managed-by=fawkes"
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    ports:
      - "9001:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    labels:
      - "plane=ufawkespipe"
      - "component=sast"
      - "managed-by=fawkes"
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:2.39.3
    ports:
      - "9443:9443"  # HTTPS UI (default from CE 2.9+)
      - "9002:8000"  # Edge agent tunnel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "plane=ufawkespipe"
      - "component=cd-engine"
      - "managed-by=fawkes"
    restart: unless-stopped

  # Security plane (uFawkesSec) — standalone mode, embedded postgres/valkey
  postgres:
    image: postgres:18-alpine
    container_name: ufawkessec-postgres
    environment:
      POSTGRES_DB: dojo
      POSTGRES_USER: dojo
      POSTGRES_PASSWORD: ${DOJO_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dojo"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "plane=ufawkespipe"
      - "component=security-db"
      - "managed-by=fawkes"

  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: ufawkessec-valkey
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "plane=ufawkespipe"
      - "component=security-cache"
      - "managed-by=fawkes"

  defectdojo:
    image: defectdojo/defectdojo-django:2.38.0
    container_name: defectdojo
    environment:
      DD_DATABASE_URL: postgresql://dojo:${DOJO_DB_PASSWORD}@postgres:5432/dojo
      DD_CELERY_BROKER_URL: redis://valkey:6379/0
      DD_SECRET_KEY_FILE: /run/secrets/defectdojo_secret_key
      DD_CREDENTIAL_AES_256_KEY_FILE: /run/secrets/defectdojo_aes_key
      DD_ALLOWED_HOSTS: "*"
    secrets:
      - defectdojo_secret_key
      - defectdojo_aes_key
    volumes:
      - defectdojo-media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      defectdojo-celery-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "plane=ufawkespipe"
      - "component=vuln-mgmt"
      - "managed-by=fawkes"

  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:2.38.0
    container_name: defectdojo-nginx
    ports:
      - "8080:8080"
    depends_on:
      - defectdojo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "plane=ufawkespipe"
      - "component=vuln-mgmt"
      - "managed-by=fawkes"

  defectdojo-celery-beat:
    image: defectdojo/defectdojo-django:2.38.0
    container_name: defectdojo-celery-beat
    command: /entrypoint-celery-beat.sh
    environment:
      DD_DATABASE_URL: postgresql://dojo:${DOJO_DB_PASSWORD}@postgres:5432/dojo
      DD_CELERY_BROKER_URL: redis://valkey:6379/0
      DD_SECRET_KEY_FILE: /run/secrets/defectdojo_secret_key
      DD_CREDENTIAL_AES_256_KEY_FILE: /run/secrets/defectdojo_aes_key
    secrets:
      - defectdojo_secret_key
      - defectdojo_aes_key
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    labels:
      - "plane=ufawkespipe"
      - "component=vuln-mgmt"
      - "managed-by=fawkes"

  defectdojo-celery-worker:
    image: defectdojo/defectdojo-django:2.38.0
    container_name: defectdojo-celery-worker
    command: /entrypoint-celery-worker.sh
    environment:
      DD_DATABASE_URL: postgresql://dojo:${DOJO_DB_PASSWORD}@postgres:5432/dojo
      DD_CELERY_BROKER_URL: redis://valkey:6379/0
      DD_SECRET_KEY_FILE: /run/secrets/defectdojo_secret_key
      DD_CREDENTIAL_AES_256_KEY_FILE: /run/secrets/defectdojo_aes_key
    secrets:
      - defectdojo_secret_key
      - defectdojo_aes_key
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "dojo", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "plane=ufawkespipe"
      - "component=vuln-mgmt"
      - "managed-by=fawkes"

  infisical:
    image: infisical/infisical:v0.93.1-postgres
    container_name: infisical
    environment:
      ENCRYPTION_KEY_FILE: /run/secrets/infisical_encryption_key
      AUTH_SECRET_FILE: /run/secrets/infisical_auth_secret
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD}@postgres:5432/infisical
      REDIS_URL: redis://valkey:6379/1
    secrets:
      - infisical_encryption_key
      - infisical_auth_secret
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "plane=ufawkespipe"
      - "component=secrets-mgmt"
      - "managed-by=fawkes"

  trivy-server:
    image: aquasec/trivy:0.74.0
    container_name: trivy-server
    command: server --listen 0.0.0.0:4954
    volumes:
      - trivy-cache:/root/.cache/trivy
    healthcheck:
      test: ["CMD", "trivy", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "plane=ufawkespipe"
      - "component=vuln-scan"
      - "managed-by=fawkes"

  # privileged: true is a documented exception — required for eBPF probe loading.
  # Exception is encoded in policy/no-privileged.rego allow-list.
  falco:
    image: falcosecurity/falco-no-driver:0.39.2
    container_name: falco
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - /dev:/host/dev:ro
      - ./config/falco/falco.yaml:/etc/falco/falco.yaml:ro
    environment:
      FALCO_WEBHOOK_URL: ${FALCO_WEBHOOK_URL:-}
    labels:
      - "plane=ufawkespipe"
      - "component=runtime-security"
      - "managed-by=fawkes"

secrets:
  defectdojo_secret_key:
    environment: DEFECTDOJO_SECRET_KEY
  defectdojo_aes_key:
    environment: DEFECTDOJO_AES_KEY
  infisical_encryption_key:
    environment: INFISICAL_ENCRYPTION_KEY
  infisical_auth_secret:
    environment: INFISICAL_AUTH_SECRET

volumes:
  woodpecker_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  portainer_data:
  postgres-data:
  valkey-data:
  defectdojo-media:
  trivy-cache:
