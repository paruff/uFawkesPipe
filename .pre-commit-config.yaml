# Pre-commit hooks for uFawkes product suite repos
# Install: make pre-commit-setup
# Run manually: pre-commit run --all-files
# Version sync: Managed by Renovate (see renovate.json) — do not edit versions manually

# Deterministic workflow: run `pre-commit run --all-files` once, `git add -A`
# for any auto-fixes, then commit. Auto-fixers (end-of-file-fixer, ruff --fix,
# markdownlint --fix) are idempotent, so the second pass is clean.
#
# Generated artifacts (graphify-out/, cache dirs, agent state) are excluded from
# ALL hooks: they are regenerated by graphify hooks and must never trigger
# fix/scan churn. Set GRAPHIFY_SKIP_HOOK=1 to disable graphify rebuilds entirely.
exclude: ^graphify-out/|^\.opencode/|^\.serena/|^\.agents/logs/

repos:
  # ============================================================================
  # General Code Quality
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ["--allow-multiple-documents"]
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ["--fix=lf"]
      - id: detect-private-key
        name: Detect private keys

  # ============================================================================
  # Python Linting & Formatting
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        name: Lint Python with Ruff
        args: ["--fix"]
      - id: ruff-format
        name: Format Python with Ruff

  # ============================================================================
  # YAML Linting
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ["-c", ".yamllint"]
        types: [yaml]

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ["--config", ".markdownlint.json", "--fix"]

  # ============================================================================
  # Security Scanning — consolidated on Gitleaks (pre-commit + Woodpecker CI +
  # GitHub reusable-security-scanning all gate on the same tool/config).
  # GitGuardian (ggshield) and detect-secrets were removed as redundant.
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks
        args: ["--config", ".gitleaks.toml"]

  # ============================================================================
  # Commit Message Validation
  # ============================================================================
  - repo: local
    hooks:
      - id: conventional-commit
        name: Validate Conventional Commits format
        entry: scripts/commit-msg.sh
        language: script
        stages: [commit-msg]

  # ============================================================================
  # Pre-push Validation (safety net)
  # ============================================================================
  - repo: local
    hooks:
      - id: pre-push-validation
        name: Pre-push validation
        entry: pre-commit run --all-files
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
