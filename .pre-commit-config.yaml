# Unified Pre-commit Configuration — uFawkes Suite Standard
# This file is the canonical source. Other repos should symlink or copy this.
# Managed by uFawkesAI template; update here, then propagate to suite repos.
#
# Install: pre-commit install --hook-type commit-msg
# Run: pre-commit run --all-files


exclude: |
  ^graphify-out/|^\.opencode/|^\.serena/|^\.agents/logs/|^\.claude/worktrees/

# One `pre-commit install` sets up every stage below (commit-msg and pre-push
# hooks are defined but only run if they are installed).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # ============================================================================
  # General Code Quality (Core)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # ============================================================================
  # Python — Ruff (lint + format, replaces flake8/black/isort)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: Lint Python with Ruff
        args: ["--fix"]
      - id: ruff-format
        name: Format Python with Ruff

  # ============================================================================
  # YAML Linting
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ["-c", ".yamllint"]
        types: [yaml]

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ["--config", ".markdownlint.json", "--fix"]
        exclude: ^CHANGELOG\.md$

  # ============================================================================
  # Security Scanning — Gitleaks (single comprehensive check)
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks
        args: ["--config", ".gitleaks.toml"]

  # ============================================================================
  # Shell Linting (shellcheck-py mirror for offline use)
  # ============================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: Lint shell scripts with shellcheck
        args: ["--severity=warning"]

  # ============================================================================
  # Shell Formatting (shfmt)
  # ============================================================================
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: Format shell scripts with shfmt
        args: ["-i", "2", "-ci", "-bn", "-sr", "-w"]
        exclude: '^scripts/buildplatform\.sh$|^.*\.zsh$'

  # ============================================================================
  # Go Code Quality
  # ============================================================================
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint
        name: Lint Go code
        exclude: ^(jenkins-shared-library/|platform/apps-deferred/unleash/examples/)

  # ============================================================================
  # Terraform (for repos with infra/)
  # ============================================================================
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        name: Terraform format
        args: ["--args=-recursive"]
      - id: terraform_validate
        name: Terraform validate
        args: ["--hook-config=--retry-once-with-cleanup=true"]
      - id: terraform_tflint
        name: Terraform lint (TFLint)
        args: ["--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"]
      - id: terraform_docs
        name: Terraform docs
        args: ["--args=--config=.terraform-docs.yml"]

  # ============================================================================
  # Kubernetes Manifest Validation
  # ============================================================================
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: Insert license header
        files: '\.(yaml|yml|tf)$'
        args:
          - --license-filepath
          - LICENSE
          - --comment-style
          - "#"
        exclude: ^(\.github/|\.pre-commit-config\.yaml|\.yamllint|platform/apps/.*/upstream/|examples/)

  # ============================================================================
  # Type-check Pipe's own code (shift-left spec R2, decided 2026-10-06): mypy for
  # the Python script, tsc for the OpenCode plugin. Both run without the project's
  # dependencies (mypy in its own env, tsc from pre-commit's node environment).
  # ============================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        name: Type-check Python (mypy)
        args: ["--ignore-missing-imports"]
        files: ^scripts/.*\.py$

  - repo: local
    hooks:
      - id: tsc
        name: Type-check JavaScript (tsc)
        # An unresolved import of the OpenCode SDK's types (TS2307) is expected here
        # and ignored. Any other type error fails, and so does tsc failing without
        # reporting one.
        entry: |
          bash -c '
            out="$(tsc --ignoreConfig --strict false --noEmit --allowJs --checkJs --target es2022 --module esnext --moduleResolution bundler --typeRoots "$NODE_PATH/@types" --types node "$@" 2>&1)" && exit 0
            rest="$(printf "%s\n" "$out" | grep "error TS" | grep -v "TS2307")"
            if [ -n "$rest" ]; then printf "%s\n" "$rest"; exit 1; fi
            printf "%s\n" "$out" | grep -q "error TS" && exit 0
            printf "%s\n" "$out"; exit 1
          ' --
        language: node
        additional_dependencies: ["typescript@7.0.2", "@types/node"]
        files: ^scripts/shift-left/opencode-plugin\.js$

  # ============================================================================
  # GitHub Actions and config schemas (shift-left spec R2): a workflow typo or
  # an invalid dependabot.yml fails here, not in a red run weeks later.
  # ============================================================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows (actionlint)

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        name: Validate workflow schemas
      - id: check-dependabot
        name: Validate dependabot.yml schema

  # ============================================================================
  # Commit Message Validation (commit-msg stage)
  # ============================================================================
  - repo: local
    hooks:
      - id: conventional-commit
        name: Validate Conventional Commits format
        entry: scripts/commit-msg.sh
        language: script
        stages: [commit-msg]

  # ============================================================================
  # uFawkes Suite Specific Validations
  # ============================================================================
  - repo: local
    hooks:
      # Validate staged *-report.md files against their output contracts
      - id: agent-report-contracts
        name: Agent report contracts
        entry: .agents/hooks/pre-commit-agent.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # DORA capability labels must match the canonical registry
      - id: dora-vocabulary
        name: DORA vocabulary
        entry: scripts/check-dora-vocabulary.sh
        language: script
        stages: [pre-commit]
        files: \.(md|yaml|yml)$
        pass_filenames: false

      # AI_STANCE.md completeness + currency
      - id: ai-stance
        name: AI stance audit
        entry: scripts/check-ai-stance.sh
        language: script
        stages: [pre-commit]
        files: (^|/)AI_STANCE\.md$|^\.agents/skills/ai-stance/
        pass_filenames: false

      # Unit tests (dependency-free offline suites)
      - id: unit-tests
        name: Unit tests (offline suites)
        entry: scripts/run-unit-tests.sh
        language: script
        stages: [pre-commit, pre-push]
        files: ^(scripts/(shift-left/|test-.*|emit-dora-event|check-secret-detection|check-ai-stance|check-dora-vocabulary|run-unit-tests).*|templates/.*\.py)$
        pass_filenames: false

      # Every harness symlink must resolve
      - id: harness-parity
        name: Harness parity
        entry: scripts/check-harness-parity.sh
        language: script
        stages: [pre-commit]
        files: ^(\.agents/|\.claude/|\.opencode/|\.cursor/|\.github/copilot-instructions\.md|GEMINI\.md|CLAUDE\.md|\.cursorrules)
        pass_filenames: false

      # Tool-backed hooks run through scripts/shift-left/require-tool.sh: a missing tool
      # fails the hook (or prints SKIPPED when SHIFT_LEFT_ALLOW_MISSING names
      # it) instead of warning and passing (shift-left spec R4).

      # Kubernetes manifest validation (kubeconform)
      - id: kubeconform
        name: Validate Kubernetes manifests (kubeconform)
        entry: |
          scripts/shift-left/require-tool.sh kubeconform -- bash -c '
            EXCLUDE_PATTERN="values.*\.yaml|kustomization\.yaml|devfiles/|recording-rules\.yaml|scrape-configs\.yaml|aliases\.yaml|dora\.yml"
            find infra/kubernetes platform -name "*.yaml" -o -name "*.yml" 2>/dev/null | grep -vE "$EXCLUDE_PATTERN" | xargs -I {} kubeconform -strict -ignore-missing-schemas {}
          '
        language: script
        pass_filenames: false
        files: '^(infra/kubernetes|platform)/.*\.(yaml|yml)$'

      # Kustomize build validation (every directory must build, not just the last)
      - id: kustomize-validate
        name: Validate Kustomize builds
        entry: |
          scripts/shift-left/require-tool.sh kustomize -- bash -c '
            for dir in $(find infra/kubernetes -name "kustomization.yaml" -exec dirname {} \;); do
              echo "Validating $dir"
              kustomize build "$dir" > /dev/null || exit 1
            done
          '
        language: script
        pass_filenames: false
        files: '^infra/kubernetes/.*kustomization\.yaml$'

      # Backstage catalog files: parse-checked by check-yaml above, like all YAML.

      # ArgoCD Application validation (render check)
      - id: argocd-validate
        name: Validate ArgoCD applications (render check)
        entry: scripts/render-all-applications.sh
        language: script
        pass_filenames: false
        files: 'platform/apps/.*-application\.yaml$'

      # Helm chart linting (every chart must lint, not just the last)
      - id: helm-lint
        name: Lint Helm charts
        entry: |
          scripts/shift-left/require-tool.sh helm -- bash -c '
            for chart in infra/kubernetes/*/Chart.yaml; do
              dir=$(dirname "$chart")
              echo "Linting $dir"
              helm lint "$dir" || exit 1
            done
          '
        language: script
        pass_filenames: false
        files: '^infra/kubernetes/.*/Chart\.yaml$'

      # Check for hardcoded secrets in K8s manifests (bash and grep only)
      - id: check-k8s-secrets
        name: Check for hardcoded secrets in K8s manifests
        entry: |
          bash -c '
            grep -r "kind: Secret" infra/kubernetes/ --include="*.yaml" --include="*.yml" 2>/dev/null \
              | grep -v "stringData: {}" \
              | grep -v "# Example" \
              | grep -v "# Template" \
              && exit 1 || exit 0
          '
        language: system
        pass_filenames: false
        files: '^infra/kubernetes/.*\.(yaml|yml)$'

      # MkDocs validation. No mkdocs.yml means nothing to build, which is not
      # the same as mkdocs missing: that fails.
      - id: mkdocs-validate
        name: Validate MkDocs configuration
        entry: |
          bash -c '
            [ -f mkdocs.yml ] || { echo "no mkdocs.yml: nothing to build"; exit 0; }
            out="$(mktemp -d)"
            scripts/shift-left/require-tool.sh mkdocs -- mkdocs build --verbose --site-dir "$out"
            rc=$?
            rm -rf "$out"
            exit $rc
          '
        language: system
        pass_filenames: false
        files: '^(mkdocs\.yml|docs/.*\.md)$'

      # Requirements pinning check (ADR-034). Fails on any >= outside a comment.
      - id: requirements-pin-check
        name: Check requirements pinning (ADR-034)
        entry: |
          bash -c '
            found=0
            for f in "$@"; do
              if grep -nE ">=" "$f" | grep -vE "^[0-9]+:[[:space:]]*#" | grep -vE "python_requires"; then
                echo "$f: ADR-034 requires == exact pins. Found >= above."
                found=1
              fi
            done
            exit $found
          ' --
        language: system
        types: [text]
        files: '(requirements.*\.txt|requirements.*\.in)$'

      # SAST: semgrep with the registry's p/ci ruleset, online when it can be,
      # from the last fetched copy when not (scripts/semgrep-scan.sh).
      - id: semgrep
        name: SAST (semgrep p/ci)
        entry: scripts/shift-left/semgrep-scan.sh
        language: python
        additional_dependencies: ["semgrep==1.179.0"]
        stages: [pre-push]
        require_serial: true # one ruleset fetch; semgrep parallelises itself
        # Deliberately insecure inputs (e.g. privileged: true) that the policy
        # tests check Pipe rejects: scanning them reports the tests, not a risk.
        exclude: ^tests/fixtures/
        types_or:
          [
            python,
            shell,
            javascript,
            ts,
            ruby,
            go,
            yaml,
            json,
            html,
            dockerfile,
            terraform,
          ]

      # Dependency scan of each changed lockfile: HIGH and CRITICAL, as a table
      # in the log (spec R8). Only the files passed in, never untracked ones.
      - id: trivy
        name: Dependency scan (Trivy, HIGH and CRITICAL)
        entry: |
          scripts/shift-left/require-tool.sh trivy -- bash -c '
            rc=0
            for f in "$@"; do
              trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table --quiet "$f" || rc=1
            done
            exit $rc
          ' --
        language: script
        stages: [pre-push]
        files: (^|/)(Gemfile\.lock|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|requirements[^/]*\.txt|poetry\.lock|uv\.lock|go\.sum|Cargo\.lock)$

      # Every hook runs in CI or .shift-left.yml says why not (spec R3, D6).
      - id: shift-left-parity
        name: CI parity (every hook runs in CI, or .shift-left.yml says why)
        entry: scripts/shift-left/check-shift-left-parity.sh
        language: script
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.shift-left\.yml|\.github/workflows/.*\.ya?ml|scripts/shift-left/check-shift-left-parity\.sh)$

      # Stamp each stage with the tree it ran on, for scripts/doctor.sh (D5).
      # Keep these last: a stamp says every hook above ran on that content.
      - id: shift-left-stamp
        name: Record that pre-commit hooks ran (doctor D5)
        entry: scripts/shift-left/shift-left-stamp.sh pre-commit
        language: script
        always_run: true
        pass_filenames: false
      - id: shift-left-stamp-pre-push
        name: Record that pre-push hooks ran (doctor D5)
        entry: scripts/shift-left/shift-left-stamp.sh pre-push
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-push]
